<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap">
<style>
:root{--bg:#FBF6EC;--card:#fff;--ink:#1F2A24;--mut:#5B6B62;--line:#E7DDC9;--g:#1F6B4F;--on:#FBF6EC;--a:#E9A23B;--guide:#D9CFB9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A17;--card:#1E2622;--ink:#F2EDE0;--mut:#A9B5AD;--line:#33403A;--g:#5BB38D;--on:#0F1512;--guide:#3A4741;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141A17;--card:#1E2622;--ink:#F2EDE0;--mut:#A9B5AD;--line:#33403A;--g:#5BB38D;--on:#0F1512;--guide:#3A4741;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:14px 18px 0;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:900;color:var(--g)}
.badge{font-size:12px;background:var(--a);color:#1F2A24;border-radius:12px;padding:2px 8px;font-weight:700;vertical-align:middle}
.top{display:flex;gap:8px;align-items:center}
.chip2{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:5px 11px;font-weight:900;font-size:17px}
.ib{width:46px;height:46px;border-radius:23px;border:2px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
main{flex:1;display:flex;flex-direction:column;gap:16px;padding:14px 0 100px}
h1{margin:0;font-size:32px;line-height:1.4;font-weight:900}
h2{margin:0;font-size:22px;font-weight:900}
.mut{color:var(--mut);font-size:17px;line-height:1.6}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--g);color:var(--on);border:0}
button{font-family:inherit;cursor:pointer}
.btn{min-height:60px;border:0;border-radius:18px;background:var(--g);color:var(--on);font-size:21px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px}
.btn.alt{background:transparent;border:3px solid var(--g);color:var(--g)}
.btn.amb{background:var(--a);color:#1F2A24}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{text-align:right;border:2px solid var(--line);border-radius:22px;padding:14px;background:color-mix(in srgb,var(--c) 13%,var(--card));color:var(--ink);display:flex;flex-direction:column;gap:8px;min-height:122px;font-size:19px;font-weight:900}
.cat .ic{color:var(--c)}
.cat small{font-size:15px;font-weight:700;color:var(--mut)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--c,var(--g))}
.mini{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.mini>span{width:104px;flex:none}
.mini .bar{flex:1;margin:0}
.mini b{font-size:13px;flex:none}
.row{display:flex;justify-content:space-between;align-items:center;min-height:62px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:0 16px;font-size:23px;font-weight:700}
input{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 22px Cairo,sans-serif;padding:0 14px}
.word{text-align:center;font-size:64px;font-weight:900;line-height:1.3;border:3px solid var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{width:68px;height:68px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:38px;font-weight:900}
.chip:disabled{opacity:.25}
.sp{display:inline-flex;vertical-align:middle;width:38px;height:38px;border-radius:19px;border:2px solid var(--line);background:var(--card);color:var(--g);align-items:center;justify-content:center;margin-inline-start:8px;padding:0;cursor:pointer;flex:none}
.cat{position:relative}.cat .sp{position:absolute;top:10px;left:10px}
.slot{width:54px;height:62px;border-radius:14px;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:var(--g)}
#pad{width:100%;height:170px;border-radius:20px;border:2px dashed var(--g);background:var(--card);touch-action:none;display:block}
.back{align-self:flex-start;min-height:48px;border:0;background:transparent;color:var(--g);font-size:19px;font-weight:700;padding:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:76px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:28px;font-weight:900}
.msg{min-height:34px;text-align:center;font-size:22px;font-weight:700;color:var(--g)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:700}
.seg button.on{background:var(--g);color:var(--on);border-color:var(--g)}
.tw{border:0;background:transparent;color:var(--ink);font-size:30px;font-weight:700;padding:4px 5px;border-bottom:3px dotted var(--g)}
.step{display:flex;align-items:center;gap:16px;font-size:21px;font-weight:700}
.dot{width:44px;height:44px;border-radius:22px;flex:none;display:flex;align-items:center;justify-content:center;border:2px dashed var(--mut);color:var(--mut)}
.dot.on{background:var(--g);border:0;color:var(--on)}
.dot.now{border:3px solid var(--g);color:var(--g)}
.step.soon{color:var(--mut);font-weight:400}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px))}
nav div{max-width:480px;margin:0 auto;display:flex;gap:8px}
nav button{flex:1;min-height:56px;border:0;border-radius:16px;background:transparent;color:var(--ink);font-size:16px;font-weight:700}
nav button.on{background:var(--g);color:var(--on)}
.lg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lb{min-height:78px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:40px;font-weight:900;position:relative}
.lb.dn{background:color-mix(in srgb,var(--g) 16%,var(--card));border-color:var(--g)}
.lb small{position:absolute;top:2px;left:6px;font-size:13px;color:var(--g)}
.fcs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fc{border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.fc .fg{font-size:42px;font-weight:900;line-height:1.3}.fc small{font-size:13px;color:var(--mut);font-weight:700}
.fc.on{border:3px solid var(--g);background:color-mix(in srgb,var(--g) 12%,var(--card))}.fc:disabled{opacity:.35}
#cel{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;overflow:hidden;padding:20px}
#cel .cb{background:var(--card);border:3px solid var(--a);border-radius:28px;padding:26px 22px;text-align:center;max-width:340px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}
#cel i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 3.2s linear infinite}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(115vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){#cel i{animation:none;display:none}}
nav button{font-size:15px;padding:0 2px}
